<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar B3</title>
  <meta name="description" content="Triagem de ações da B3 com análise explicada e alertas.">
  <meta name="theme-color" content="#1a1a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="app">
    <nav class="trilho" aria-label="Navegação">
      <a class="marca" href="#inicio" aria-label="Radar B3, visão geral"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22a11 11 0 0 1 22 0" /><path d="M10 22a6 6 0 0 1 12 0" /><circle cx="16" cy="22" r="2.2" /><path d="M16 22 24 13" /></svg></a>
      <div class="trilho-itens" id="menu">
        <a href="#inicio" data-aba="inicio" title="Visão geral"><i class="ti ti-layout-dashboard"></i><span>Início</span></a>
        <a href="#estrategias" data-aba="estrategias" title="Estratégias"><i class="ti ti-filter"></i><span>Estratégias</span></a>
        <a href="#acao" data-aba="acao" title="Ações"><i class="ti ti-chart-candle"></i><span>Ações</span></a>
        <a href="#watchlist" data-aba="watchlist" title="Watchlist"><i class="ti ti-star"></i><span>Watchlist</span></a>
        <a href="#alertas" data-aba="alertas" title="Alertas"><i class="ti ti-bell"></i><span>Alertas</span></a>
      </div>
      <button class="trilho-busca" type="button" id="abrir-busca-trilho" title="Buscar ação (Ctrl K)" aria-label="Buscar ação"><i class="ti ti-search"></i></button>
    </nav>

    <main class="tela" id="conteudo"></main>
  </div>

  <div class="paleta" id="paleta" hidden>
    <div class="paleta-caixa" role="dialog" aria-label="Buscar ação">
      <div class="paleta-campo"><i class="ti ti-search"></i>
        <input id="paleta-input" placeholder="Código ou nome da empresa" autocomplete="off" spellcheck="false" aria-label="Código ou nome da empresa">
        <kbd>Esc</kbd></div>
      <div class="paleta-lista" id="paleta-lista"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
