<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radar B3</title>
  <meta name="description" content="Triagem de ações da B3 com análise explicada e alertas.">
  <meta name="theme-color" content="#140d0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone-192.png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="lateral" aria-label="Navegação">
      <div class="lateral-topo">
        <a class="marca" href="#inicio" aria-label="Radar B3, visão geral">
          <span class="marca-icone"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22a11 11 0 0 1 22 0" /><path d="M10 22a6 6 0 0 1 12 0" /><circle cx="16" cy="22" r="2.2" /><path d="M16 22 24 13" /></svg></span>
          <span class="rotulo-menu">Radar <b>B3</b></span>
        </a>
      </div>
      <div class="menu" id="menu">
        <span class="menu-grupo rotulo-menu">Mercado</span>
        <a href="#inicio" data-aba="inicio" title="Visão geral"><i class="ti ti-smart-home"></i><span>Visão geral</span></a>
        <a href="#estrategias" data-aba="estrategias" title="Estratégias"><i class="ti ti-filter"></i><span>Estratégias</span></a>
        <a href="#acao" data-aba="acao" title="Ações"><i class="ti ti-chart-candle"></i><span>Ações</span></a>
        <span class="menu-grupo rotulo-menu">Você</span>
        <a href="#watchlist" data-aba="watchlist" title="Watchlist"><i class="ti ti-star"></i><span>Watchlist</span></a>
        <a href="#carteira" data-aba="carteira" title="Carteira"><i class="ti ti-wallet"></i><span>Carteira</span></a>
        <a href="#alertas" data-aba="alertas" title="Alertas"><i class="ti ti-bell"></i><span>Alertas</span></a>
      </div>
      <div class="lateral-base">
        <div class="status-menu" id="status-menu"><span class="ponto"></span><span class="rotulo-menu" id="status-texto">Ao vivo</span></div>
        <button type="button" id="abrir-busca-trilho" title="Buscar ação (Ctrl K)" aria-label="Buscar ação"><i class="ti ti-search"></i><span class="rotulo-menu">Buscar</span></button>
        <button type="button" id="alternar-menu" title="Abrir ou fechar o menu" aria-label="Abrir ou fechar o menu" aria-expanded="false"><i class="ti ti-layout-sidebar-left-expand"></i><span class="rotulo-menu">Recolher menu</span></button>
      </div>
    </nav>

    <main class="tela" id="conteudo"></main>
  </div>

  <div class="paleta" id="paleta" hidden>
    <div class="paleta-caixa" role="dialog" aria-label="Buscar ação">
      <div class="paleta-campo"><i class="ti ti-search"></i>
        <input id="paleta-input" placeholder="Código ou nome da empresa" autocomplete="off" spellcheck="false" aria-label="Código ou nome da empresa">
        <kbd>Esc</kbd></div>
      <div class="paleta-lista" id="paleta-lista"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="config.js"></script>
  <script src="rede.js"></script>
  <script src="globo.js"></script>
  <script src="mapa.js"></script>
  <script src="carteira.js"></script>
  <script src="app.js"></script>
</body>
</html>
